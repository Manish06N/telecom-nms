services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: telecom
      POSTGRES_PASSWORD: telecom
      POSTGRES_DB: telecom
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telecom -d telecom"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  api:
    build: .
    ports:
      - "8000:8000"
    environment: &app_env
      DEBUG: "true"
      SECRET_KEY: dev-only-secret-change-before-any-real-deployment
      DATABASE_URL: postgresql+psycopg://telecom:telecom@db:5432/telecom
      REDIS_URL: redis://redis:6379/0
      AUTO_SEED: "true"
      ADMIN_EMAIL: admin@telecom.local
      ADMIN_PASSWORD: Admin@12345
      RATE_LIMIT_ENABLED: "true"
      DELIVER_NOTIFICATIONS: "true"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build: .
    command: celery -A app.workers.tasks.celery_app worker --loglevel=info
    environment: *app_env
    profiles: ["workers"]
    depends_on:
      - db
      - redis
